name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check translations
        run: bun run i18n:check

      - name: Lint & format check
        run: bun run lint

      - name: Test frontend
        run: bun run web:test

      - name: Check SvelteKit & TypeScript
        run: bun run check

      - name: Check Worker types
        run: bun run worker:check

      - name: Check end-to-end test types
        run: bun run e2e:check

      - name: Test Worker
        run: bun run worker:test

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Build and test browser flows
        run: bun run e2e:test

      - name: Upload browser test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore
